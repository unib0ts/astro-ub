<!-- mermaid-init v3 -->
<script>
(function () {
  if (window.__astroMermaidLoading) return;
  window.__astroMermaidLoading = true;

  function renderMermaid() {
    if (typeof mermaid === "undefined") return;
    if (window.__astroMermaidDone) return;
    window.__astroMermaidDone = true;

    mermaid.initialize({
      startOnLoad: false,
      theme: "default",
      securityLevel: "loose",
      flowchart: { htmlLabels: true },
    });

    var blocks = document.querySelectorAll("pre code.language-mermaid");
    for (var i = 0; i < blocks.length; i++) {
      var code = blocks[i];
      var pre = code.parentNode;
      if (!pre || !pre.parentNode) continue;
      var div = document.createElement("div");
      div.className = "mermaid";
      div.textContent = code.textContent;
      pre.parentNode.replaceChild(div, pre);
    }

    var graphs = document.querySelectorAll("div.mermaid");
    if (graphs.length) {
      try {
        mermaid.init(undefined, graphs);
      } catch (e) {
        console.error("Mermaid render failed", e);
      }
    }
  }

  function loadAndRender() {
    if (typeof mermaid !== "undefined") {
      renderMermaid();
      return;
    }
    var s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js";
    s.onload = renderMermaid;
    s.onerror = function () {
      console.error("Failed to load Mermaid from CDN");
    };
    document.head.appendChild(s);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", loadAndRender);
  } else {
    loadAndRender();
  }
})();
</script>
<style>
  .mermaid {
    margin: 1.25rem 0;
    overflow-x: auto;
    text-align: center;
    background: #f6f8fa;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    padding: 1rem;
  }
  .mermaid svg {
    max-width: 100%;
    height: auto;
  }
</style>

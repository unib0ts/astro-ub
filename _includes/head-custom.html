<!-- Mermaid for GitHub Pages (Jekyll emits pre>code.language-mermaid) -->
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

  mermaid.initialize({
    startOnLoad: false,
    theme: "default",
    securityLevel: "loose",
    flowchart: { htmlLabels: true, curve: "basis" },
    sequence: { actorMargin: 24, messageMargin: 40 },
  });

  const blocks = document.querySelectorAll("pre code.language-mermaid");
  for (const code of blocks) {
    const pre = code.parentElement;
    if (!pre) continue;
    const graph = document.createElement("div");
    graph.className = "mermaid";
    // textContent is HTML-decoded (--> not --&gt;), which Mermaid needs
    graph.textContent = code.textContent;
    pre.replaceWith(graph);
  }

  if (blocks.length) {
    await mermaid.run({ querySelector: ".mermaid" });
  }
</script>
<style>
  .mermaid {
    margin: 1.25rem 0;
    overflow-x: auto;
    text-align: center;
    background: #f6f8fa;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    padding: 1rem;
  }
  .mermaid svg {
    max-width: 100%;
    height: auto;
  }
</style>
